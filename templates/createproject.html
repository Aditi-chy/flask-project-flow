
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Project | ProjectFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/createproject.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0"
          rel="stylesheet">
</head>

<body>

    <header class="topbar">
        <a href="{{ url_for('dashboard') }}" class="brand" aria-label="Dashboard home">
            <span class="material-symbols-rounded brand-icon">dashboard</span>
            <span>ProjectFlow</span>
        </a>

        <div class="topbar-right">
            <span class="workspace-label">My Workspace</span>

            <div class="user-menu-wrapper">
                <button
                    type="button"
                    id="userButton"
                    class="user-button"
                    aria-label="Open user menu"
                    aria-expanded="false"
                    aria-controls="userMenu">

                    <span class="material-symbols-rounded">account_circle</span>
                </button>

                <div id="userMenu" class="user-menu" hidden>
                    <a href="{{ url_for('pages.profile_page') }}">
                        <span class="material-symbols-rounded">person</span>
                        Profile
                    </a>

                    <a href="{{ url_for('auth.signout') }}">
                        <span class="material-symbols-rounded">logout</span>
                        Sign Out
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="dashboard-layout app-layout">

        <aside class="sidebar">
            <p class="sidebar-label">WORKSPACE</p>

            <nav class="sidebar-navigation sidebar-nav">

                <a href="{{ url_for('dashboard') }}"
                   class="sidebar-link nav-link active">
                    <span class="material-symbols-rounded">home</span>
                    <span>Home</span>
                </a>

                <a href="{{ url_for('pages.about_page') }}"
                   class="sidebar-link nav-link">
                    <span class="material-symbols-rounded">info</span>
                    <span>About</span>
                </a>

                <a href="{{ url_for('pages.contact_page') }}"
                   class="sidebar-link nav-link">
                    <span class="material-symbols-rounded">mail</span>
                    <span>Contact</span>
                </a>

            </nav>
        </aside>

        <main class="dashboard-main page-main">

            <section class="page-heading">

                <a href="{{ url_for('dashboard') }}" class="back-link">
                    <span class="material-symbols-rounded">arrow_back</span>
                    Back to projects
                </a>

                <p class="eyebrow">YOUR WORKSPACE</p>

                <h1>Create Project</h1>

                <p class="page-description">
                    Add the details of your new project.
                </p>

            </section>

            <section class="form-panel">

                <form id="projectForm">

                    <div class="form-field">
                        <label for="title">Project Title</label>

                        <input
                            type="text"
                            id="title"
                            name="title"
                            maxlength="40"
                            placeholder="Enter a project title"
                            required>
                    </div>

                    <div class="form-field">
                        <label for="description">Description</label>

                        <textarea
                            id="description"
                            name="description"
                            rows="5"
                            placeholder="What is this project about?"
                            required></textarea>
                    </div>

                    <div class="form-grid">

                        <div class="form-field">
                            <label for="duration">Duration (months)</label>

                            <input
                                type="number"
                                id="duration"
                                name="duration"
                                min="1"
                                step="1"
                                placeholder="e.g. 6"
                                required>
                        </div>

                        <div class="form-field">
                            <label for="agency">Agency</label>

                            <input
                                type="text"
                                id="agency"
                                name="agency"
                                maxlength="40"
                                placeholder="Enter agency name"
                                required>
                        </div>

                    </div>

                    <div class="form-field">
                        <label for="budget">Budget (₹)</label>

                        <input
                            type="number"
                            id="budget"
                            name="budget"
                            min="0"
                            step="0.01"
                            placeholder="Enter project budget"
                            required>
                    </div>

                    <p
                        id="createProjectMessage"
                        class="form-message"
                        role="status"
                        aria-live="polite"></p>

                    <div class="form-actions">

                        <a href="{{ url_for('dashboard') }}"
                           class="secondary-button">
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="primary-button"
                            id="createProjectSubmit">

                            <span class="material-symbols-rounded">add</span>
                            <span>Create Project</span>

                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

    <footer class="page-footer">
        <p>© 2026 Project Flow</p>
    </footer>

    <script src="{{ url_for('static', filename='script/createproject.js') }}"></script>

</body>
</html>
