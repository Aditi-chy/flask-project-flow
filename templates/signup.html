<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Project Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/signup.css') }}">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>

<body>

    <main class="signup-page">

        <section class="signup-card">

            <header class="signup-header">
                <div class="logo-icon">
                    <span class="material-symbols-outlined">dashboard</span>
                </div>

                <h1>Project Flow</h1>
                <p>Create your account to get started</p>
            </header>

            <div class="form-heading">
                <h2>Create Account</h2>
                <p>Enter your details below to register.</p>
            </div>

            <form id="signupForm">

                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input
                        type="text"
                        id="signupName"
                        name="name"
                        placeholder="Enter your full name"
                        maxlength="30"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupUsername">Username</label>
                    <input
                        type="text"
                        id="signupUsername"
                        name="username"
                        placeholder="Choose a username"
                        minlength="3"
                        maxlength="10"
                        autocomplete="username"
                        required
                    >
                    <span class="input-hint">Use 3-10 characters.</span>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input
                        type="email"
                        id="signupEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="signupPassword"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            maxlength="30"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>

                    <span class="input-hint">Use 8-30 characters.</span>
                </div>

                <p
                    id="signupMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button type="submit" class="signup-button">
                    Create account
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>

            </form>

            <p class="signin-link">
                Already have an account?
                <a href="{{ url_for('signin_page') }}">Sign in</a>
            </p>

        </section>

        <footer class="page-footer">
            Project Flow
        </footer>

    </main>

    <script src="{{ url_for('static', filename='script/signup.js') }}"></script>

</body>

</html>
