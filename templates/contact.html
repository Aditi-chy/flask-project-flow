<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/contact.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0"
          rel="stylesheet">
</head>

<body>

    <header>
        <a href="/dashboard" class="header-link">
            <span class="material-symbols-outlined">home</span>
            <span>Home</span>
        </a>

        <h1>Contact Us</h1>

        <a href="/signout" class="header-link">
            <span class="material-symbols-outlined">logout</span>
            <span>Sign Out</span>
        </a>
    </header>

    <main>
        <section>
            <h2>
                <span class="material-symbols-outlined">contact_mail</span>
                Contact us
            </h2>

            <p>
                <span class="material-symbols-outlined">mail</span>
                Email:
                <a class="email-link" href="mailto:management@gmail.com">
                    projectflow@gmail.com
                </a>
            </p>

            <h3>
                Have a question or feedback about the Project Management System?
            </h3>

            <form id="contactForm">
                <label for="contactName">Name:</label>
                <input
                    type="text"
                    id="contactName"
                    name="name"
                    maxlength="100"
                    autocomplete="name"
                    required
                >

                <label for="contactEmail">Email:</label>
                <input
                    type="email"
                    id="contactEmail"
                    name="email"
                    maxlength="150"
                    autocomplete="email"
                    required
                >

                <label for="contactMessage">Message:</label>
                <textarea
                    id="contactMessage"
                    name="message"
                    rows="5"
                    required
                ></textarea>

                <button type="submit">
                    <span class="material-symbols-outlined">send</span>
                    Submit
                </button>
            </form>

            <p id="contactStatus" role="status" aria-live="polite"></p>

            <a class="back-link" href="/dashboard">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to Dashboard
            </a>
        </section>
    </main>

    <footer>
        <p>© 2026 Project Flow</p>
    </footer>

    <script src="{{ url_for('static', filename='script/feedback.js') }}"></script>

</body>
</html>
